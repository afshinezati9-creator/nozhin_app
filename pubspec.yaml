name: nozhin
description: نوژین - دستیار هوشمند زندگی | نسخه حرفه‌ای آفلاین
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  flutter_svg: ^2.0.10+1
  intl: any
  uuid: ^4.4.0
  collection: ^1.18.0
  equatable: ^2.0.5
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.8

  # Rich text editor
  flutter_quill: ^11.4.1

  # Media
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  isar_generator: ^3.1.0+1
  json_serializable: ^6.8.0

dependency_overrides:
  # حل تعارض intl بین flutter_localizations و flutter_quill
  intl: ^0.20.2

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Thin.ttf
          weight: 100
        - asset: assets/fonts/Vazirmatn-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
