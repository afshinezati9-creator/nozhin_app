name: Hawzhin Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hawzhin-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Analyze and build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      # Existing lint infos/warnings should not prevent APK generation.
      # Analyzer errors still fail this step.
      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Configure release signing if secrets exist
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" && -n "$ANDROID_STORE_PASSWORD" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "store_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "store_signed=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore configured: APK will use the debug key and is for testing only."
          fi

      - name: Build ARM64 APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Build Android App Bundle for stores
        if: steps.signing.outputs.store_signed == 'true'
        run: flutter build appbundle --release

      - name: Name APK artifact
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -n1 | cut -d+ -f1)"
          SOURCE="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$SOURCE"
          cp "$SOURCE" "build/app/outputs/flutter-apk/Hawzhin-${VERSION}.apk"
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hawzhin-APK
          path: build/app/outputs/flutter-apk/Hawzhin-*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload store-signed AAB
        if: steps.signing.outputs.store_signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Hawzhin-Store-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      # Run tests after uploading the APK so a test failure does not hide the build artifact.
      - name: Run Flutter tests
        run: flutter test --no-pub
